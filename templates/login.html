<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <div class="login-card">

            <h1>Admin Login</h1>

            <p>Login to manage the queue.</p>

            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}

            <form
                action="/admin/login"
                method="POST"
            >

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button
                    type="submit"
                    class="login-button"
                >
                    LOGIN
                </button>

            </form>

        </div>

    </div>

</body>

</html>
