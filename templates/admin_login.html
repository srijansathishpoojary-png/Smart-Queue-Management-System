<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - SmartQueue</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                Smart<span>Queue</span>
            </div>

            <h1>
                Admin Login
            </h1>

            <p class="login-subtitle">
                Sign in to manage the queue.
            </p>


            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="/admin/login"
            >

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <a
                href="/"
                class="back-home"
            >
                ← Back to Queue
            </a>

        </div>

    </div>

</body>

</html>
