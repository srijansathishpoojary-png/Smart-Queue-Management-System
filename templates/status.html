<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Queue Status</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>Queue Status</h1>

        <div class="status-card">

            <p>
                Hello,
                <strong id="user-name">
                    {{ person["name"] }}
                </strong>!
            </p>

            <p>Your Token</p>

            <div class="token">
                <span id="user-token">
                    {{ person["token"] }}
                </span>
            </div>


            <p>Currently Serving</p>

            <div class="current-token-small">

                <span id="current-token">

                    {% if current %}
                        {{ current["token"] }}
                    {% else %}
                        ---
                    {% endif %}

                </span>

            </div>


            <div id="waiting-section">

                <p>People Ahead</p>

                <div class="people-ahead">

                    <span id="people-ahead">
                        {{ people_ahead }}
                    </span>

                </div>

                <div class="waiting-message">
                    Please wait for your turn.
                </div>

            </div>


            <div
                id="your-turn-section"
                class="your-turn"
                style="display: none;"
            >
                🎉 IT'S YOUR TURN!
            </div>


            <div
                id="served-section"
                class="served-message"
                style="display: none;"
            >
                Your service is complete.
            </div>

        </div>

    </div>


    <script>

        const token = "{{ person['token'] }}";


        function updateStatus() {

            fetch("/api/status/" + token)

                .then(response => response.json())

                .then(data => {

                    if (data.error) {
                        return;
                    }


                    // Update name
                    document.getElementById(
                        "user-name"
                    ).textContent = data.name;


                    // Update current token
                    document.getElementById(
                        "current-token"
                    ).textContent =
                        data.current_token || "---";


                    // Waiting
                    if (data.status === "Waiting") {

                        document.getElementById(
                            "people-ahead"
                        ).textContent =
                            data.people_ahead;

                        document.getElementById(
                            "waiting-section"
                        ).style.display = "block";

                        document.getElementById(
                            "your-turn-section"
                        ).style.display = "none";

                        document.getElementById(
                            "served-section"
                        ).style.display = "none";

                    }


                    // Serving
                    else if (data.status === "Serving") {

                        document.getElementById(
                            "waiting-section"
                        ).style.display = "none";

                        document.getElementById(
                            "your-turn-section"
                        ).style.display = "block";

                        document.getElementById(
                            "served-section"
                        ).style.display = "none";

                    }


                    // Served
                    else if (data.status === "Served") {

                        document.getElementById(
                            "waiting-section"
                        ).style.display = "none";

                        document.getElementById(
                            "your-turn-section"
                        ).style.display = "none";

                        document.getElementById(
                            "served-section"
                        ).style.display = "block";

                    }

                })

                .catch(error => {
                    console.log(
                        "Unable to update queue status."
                    );
                });
        }


        // Check the queue every 3 seconds
        setInterval(updateStatus, 3000);

    </script>

</body>

</html>
